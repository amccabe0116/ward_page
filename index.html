<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>North Point YSA</title>
  <meta name="description" content="North Point YSA Ward — Sunday roll and weekly announcements.">
  <meta name="theme-color" content="#1b2a41">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><rect width='100' height='100' rx='20' fill='%231b2a41'/><text x='50' y='68' font-size='52' text-anchor='middle' fill='%23e2c377' font-family='Georgia'>N</text></svg>">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600&family=Inter:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="app.css">
</head>
<body>
  <header class="hero">
    <p class="eyebrow">The Church of Jesus Christ of Latter-day Saints</p>
    <h1>North Point YSA</h1>
    <p class="date" id="today"></p>
  </header>

  <main class="wrap">
    <nav class="choices" aria-label="Take roll">
      <a class="choice" href="roll.html?class=sunday_school">
        <span class="icon" id="icon-ss"></span>
        <span class="text">
          <span class="label">Sunday School</span>
          <span class="sub">Check in for class</span>
        </span>
        <span class="chev" id="chev-ss"></span>
      </a>
      <a class="choice" href="roll.html?class=priesthood_rs">
        <span class="icon" id="icon-prs"></span>
        <span class="text">
          <span class="label">Priesthood / Relief Society</span>
          <span class="sub">Elders Quorum &amp; Relief Society</span>
        </span>
        <span class="chev" id="chev-prs"></span>
      </a>
    </nav>

    <section aria-labelledby="ann-title">
      <div class="section-title">
        <h2 id="ann-title">Announcements</h2>
        <span class="meta" id="ann-meta"></span>
      </div>
      <div class="card" id="announcements">
        <p class="empty">Loading…</p>
      </div>
    </section>

    <p class="footer">North Point YSA Ward · Roswell Georgia Stake · <a href="admin.html">Leaders</a></p>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
  <script>
    (function () {
      const { el, fmtDate, linkify, escapeHtml, icons } = NP;
      document.getElementById('icon-ss').innerHTML = icons.book;
      document.getElementById('icon-prs').innerHTML = icons.people;
      document.getElementById('chev-ss').innerHTML = icons.chevron;
      document.getElementById('chev-prs').innerHTML = icons.chevron;

      document.getElementById('today').textContent = new Date().toLocaleDateString('en-US', { timeZone: NP.C.timeZone, weekday: 'long', month: 'long', day: 'numeric' });

      const box = document.getElementById('announcements');
      const meta = document.getElementById('ann-meta');
      fetch('announcements.json?v=' + Date.now(), { cache: 'no-store' })
        .then(r => r.ok ? r.json() : Promise.reject(new Error(r.status)))
        .then(a => {
          box.innerHTML = '';
          if (!a || (!a.text && !(a.images && a.images.length))) {
            box.appendChild(el('p', { class: 'empty' }, 'No announcements posted yet.'));
            return;
          }
          if (a.sent_at) {
            const d = new Date(a.sent_at);
            meta.textContent = 'Posted ' + d.toLocaleDateString('en-US', { timeZone: NP.C.timeZone, month: 'short', day: 'numeric' });
          }
          if (a.text) box.appendChild(el('div', { class: 'announcement-body', html: linkify(a.text) }));
          if (a.images && a.images.length) {
            const g = el('div', { class: 'announcement-images' });
            for (const src of a.images) g.appendChild(el('a', { href: src, target: '_blank', rel: 'noopener' }, el('img', { src, alt: 'Announcement flyer', loading: 'lazy' })));
            box.appendChild(g);
          }
        })
        .catch(() => { box.innerHTML = ''; box.appendChild(el('p', { class: 'empty' }, 'No announcements posted yet.')); });
    })();
  </script>
</body>
</html>
